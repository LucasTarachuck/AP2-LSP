name: Gerar APK Flutter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar estrutura do projeto
        run: |
          pwd
          ls -la
          ls -la ap2_lsp
          find . -name "pubspec.yaml"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env
        working-directory: ./ap2_lsp
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> .env

      - name: Instalar dependencias
        working-directory: ./ap2_lsp
        run: flutter pub get

      - name: Gerar APK
        working-directory: ./ap2_lsp
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AP2_LSP-APK
          path: ap2_lsp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error